name: M57 Android app

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: android-blocker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The default also requests the obsolete SDK package named "tools".
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, lint, and APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: m57-debug
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m57-checks
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
