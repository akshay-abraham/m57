name: Signed M57 release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: m57-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate tag and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check-release.py "$RELEASE_TAG"
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build debug variant
        env:
          M57_SOURCE_REF: ${{ github.sha }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.M57_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure M57 signing secrets before pushing release tags.'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/m57-release.jks"
      - name: Build signed release
        env:
          M57_SOURCE_REF: ${{ github.sha }}
          M57_KEYSTORE: ${{ runner.temp }}/m57-release.jks
          M57_STORE_PASSWORD: ${{ secrets.M57_STORE_PASSWORD }}
          M57_KEY_ALIAS: ${{ secrets.M57_KEY_ALIAS }}
          M57_KEY_PASSWORD: ${{ secrets.M57_KEY_PASSWORD }}
        run: ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --no-daemon
      - name: Verify signature and package corresponding source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SIGNER: ${{ secrets.M57_SIGNER_SHA256 }}
        run: |
          test -n "$EXPECTED_SIGNER" || { echo 'Configure M57_SIGNER_SHA256 to verify signing continuity.'; exit 1; }
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/m57-$RELEASE_TAG.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "dist/m57-$RELEASE_TAG.apk" > dist/SIGNING.txt
          python3 scripts/check-signer.py dist/SIGNING.txt "$EXPECTED_SIGNER"
          git archive --format=tar.gz --prefix="m57-$RELEASE_TAG/" -o "dist/m57-$RELEASE_TAG-source.tar.gz" HEAD
          cp LICENSE NOTICE LICENSING.md dist/
          cp -r LICENSES dist/
          (cd dist && sha256sum "m57-$RELEASE_TAG.apk" "m57-$RELEASE_TAG-source.tar.gz" > SHA256SUMS)
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.apk dist/*-source.tar.gz dist/SHA256SUMS dist/SIGNING.txt dist/LICENSE dist/NOTICE dist/LICENSING.md \
            --verify-tag --prerelease --title "M57 $RELEASE_TAG" --notes-file "docs/releases/${RELEASE_TAG#v}.md"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/m57-release.jks"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: m57-release-checks
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
